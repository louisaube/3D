[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pycam3d"
version = "0.1.0"
description = "CAM software integrating OpenCAMLib, Trimesh, and Open3D for 3D toolpath generation"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "PyCAM3D Contributors"}
]
keywords = ["CAM", "CNC", "toolpath", "gcode", "3D", "milling", "OpenCAMLib"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Manufacturing",
]

dependencies = [
    "numpy>=1.21.0",
    "trimesh[easy]>=4.0.0",
    "open3d>=0.17.0",
    "opencamlib>=2023.1.11",
    "click>=8.0.0",
    "rich>=13.0.0",
    "scipy>=1.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
pycam3d = "pycam3d.cli:main"

[project.urls]
Homepage = "https://github.com/louisaube/3D"
Repository = "https://github.com/louisaube/3D"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
